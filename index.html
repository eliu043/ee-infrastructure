<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infrastructure: Instruments of Power</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect x=%273%27 y=%273%27 width=%2710%27 height=%2710%27 fill=%27%23ff4d3a%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
:root{
  --ink:#eef1ee; --ink2:#c9d0cc; --dim:#9aa5a0; --faint:#6b7571; --bg:#07090a;
  --k750:#ff4d3a; --k330:#ffb648; --k150:#e7d27c; --water:#5cc8ff; --hit:#ff2d55; --ok:#9dfcc4;
  --mono:"IBM Plex Mono",ui-monospace,monospace; --sans:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --glass:rgba(10,13,15,.72); --edge:rgba(255,255,255,.12); --edge2:rgba(255,255,255,.06);
  --blur:blur(18px) saturate(1.3);
  --gut:20px; --pw:clamp(320px,25vw,380px); --rw:250px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border-radius:0}
#map{position:absolute;inset:0}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 55% 45%,transparent 50%,rgba(0,0,0,.5) 100%)}
#dimmer{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
.hud{position:absolute;pointer-events:none;transition:opacity .9s}
.glass{background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}

/* ───────────── opening title ───────────── */
#intro{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity 1.1s ease}
#intro.on{opacity:1}
.ttl{margin:0;text-align:center;text-shadow:0 2px 30px rgba(0,0,0,.8)}
.ttl span{display:block}
.ttl .a{font:600 clamp(34px,6vw,92px)/1 var(--sans);letter-spacing:.2em;padding-left:.2em;text-transform:uppercase}
.ttl .b{margin-top:.55em;font:300 clamp(18px,2.5vw,36px)/1.1 var(--sans);letter-spacing:.08em;color:var(--ink2)}

/* ───────────── story panel ───────────── */
#panel{position:absolute;left:var(--gut);top:var(--gut);width:var(--pw);max-height:calc(100% - var(--gut) * 2);z-index:6;display:flex;flex-direction:column;transition:opacity .8s,transform .8s}
body.intro #panel,body.intro #legend,body.intro #rightcol{opacity:0;transform:translateY(-6px);pointer-events:none}
.pbody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px 18px 12px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.slide{animation:slideIn .5s cubic-bezier(.2,.8,.2,1) both}
.slide.back{animation-name:slideInBack}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideInBack{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.slide .hd{display:flex;align-items:baseline;gap:10px}
.slide h2{margin:0;font:500 23px/1.12 var(--sans);letter-spacing:.01em;text-wrap:balance}
.dateline{margin-top:6px;font:500 11px var(--mono);letter-spacing:.12em;color:var(--dim);font-variant-numeric:tabular-nums}
.dateline.none{display:none}
.lede{margin:12px 0 0;font:400 15px/1.55 var(--body);color:var(--ink2)}
.lede.more{margin-top:8px}
.src{margin:12px 0 0;font:10px/1.5 var(--mono);color:var(--faint)}
/* slide list */
#menu{display:none;flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 0;scrollbar-width:thin}
#panel.menu #menu{display:block} #panel.menu .pbody,#panel.menu #pdata{display:none}
#menu a{display:flex;gap:12px;align-items:baseline;padding:8px 18px;color:var(--ink2);text-decoration:none;font:500 15px var(--sans);letter-spacing:.02em}
#menu a:hover{background:rgba(255,255,255,.06);color:var(--ink)}
#menu a .n{flex:none;width:18px;font:500 10.5px var(--mono);color:var(--faint)}
#menu a.cur{color:var(--ink);box-shadow:inset 2px 0 0 var(--k750)}
#menu a.cur .n{color:var(--k750)}
/* nav bar with the slide's progress as its top edge */
.pnav{position:relative;display:grid;grid-template-columns:1fr 40px 40px auto 1fr;border-top:1px solid var(--edge)}
#scrub{position:absolute;left:0;right:0;top:-6px;height:11px;cursor:pointer;z-index:1}
#scrub .fill{position:absolute;left:0;top:5px;height:1px;background:var(--k750)}
#scrub:hover .fill{top:4px;height:3px}
.pnav button{height:40px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font:500 13px var(--sans);letter-spacing:.06em;color:var(--ink);transition:background .2s,color .2s}
.pnav button+button{border-left:1px solid var(--edge)}
.pnav button:hover:not(:disabled){background:rgba(255,255,255,.07)}
.pnav button:disabled{color:var(--faint);cursor:default}
.pnav svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6}
#bPlay svg{fill:currentColor;stroke:none;width:10px;height:10px}
#bPlay svg.r{fill:none;stroke:currentColor;stroke-width:1.5}
#bSnd svg{width:13px;height:13px}#bSnd .f{fill:currentColor;stroke:none}#bSnd.off{color:var(--faint)}
#counter .note{color:var(--faint);margin-top:6px}#counter .note:empty{display:none}
#bMenu{padding:0 14px;font:500 11.5px var(--mono);letter-spacing:.04em;color:var(--ink2)}
#bMenu.on{background:rgba(255,255,255,.1)}
#bNext.ready{background:rgba(255,77,58,.2)}
button:focus-visible,#menu a:focus-visible{outline:1px solid var(--k750);outline-offset:-1px}

/* ───────────── data inside the story panel (timeline, log, counters) ───────────── */
#pdata{display:none;flex:none;padding:10px 18px 8px;border-top:1px solid var(--edge2)}
#pdata.on{display:block}
#pdata .glass,#pdata .hud{position:static;background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;pointer-events:auto}
#pdata #timeline{left:auto;bottom:auto;transform:none;width:auto;height:auto;padding:0;margin:0 0 8px}
#pdata #timeline .tnote{white-space:nowrap}
#pdata .card{padding:0 0 8px;display:flex;align-items:center;gap:14px}
#pdata #counter .v,#pdata #ucdpCount .v{font-size:46px;flex:none;min-width:2ch}
#pdata #counter .k,#pdata #ucdpCount .k{margin:0;font-size:9.5px;line-height:1.5}
#pdata #log{padding:8px 0 4px;border-top:1px solid var(--edge2)}
#pdata #log .e{padding:4px 7px 4px 8px;margin-bottom:3px}
#pdata #log .e span{-webkit-line-clamp:1}
@media (max-height:680px){#pdata #log{display:none!important}}

/* ───────────── legend + data cards ───────────── */
#legend{padding:8px 11px;pointer-events:none}
#legend:empty{display:none}
#legend .row{display:flex;align-items:center;gap:9px;font:11px/1.35 var(--body);color:var(--ink2);padding:2px 0}
#legend .sw{flex:none;width:20px;height:11px;display:grid;place-items:center}
#rightcol{position:absolute;top:var(--gut);right:var(--gut);width:var(--rw);display:flex;flex-direction:column;gap:10px;z-index:4;pointer-events:none;transition:opacity .8s,transform .8s}
#rightcol>*{transition:opacity .7s}
.card{padding:10px 12px}
#counter .v,#ucdpCount .v{font:300 52px/0.95 var(--sans);color:var(--hit);font-variant-numeric:tabular-nums}
#ucdpCount .v{color:#ff8a7a}
#counter .k,#ucdpCount .k{margin-top:6px;font:500 9.5px/1.5 var(--mono);letter-spacing:.12em;color:var(--dim)}
#log{padding:10px 10px 6px;font:10.5px/1.45 var(--mono)}
#lclegend{padding:10px 12px;font:9.5px/1.4 var(--mono);letter-spacing:.1em;color:var(--dim)}
#lclegend .t{color:var(--ink);margin-bottom:7px}#lclegend .bar{height:8px}#lclegend .ab{display:flex;justify-content:space-between;margin-top:5px}#lclegend .s{margin-top:5px;color:var(--faint);font-size:8.5px}
#chart{padding:8px 10px}#chart svg{width:100%;height:auto;display:block;font-family:var(--mono)}
#pdata #lclegend,#pdata #chart{padding:8px 0;border-top:1px solid var(--edge2)}
#log .h{font:500 9.5px var(--mono);letter-spacing:.18em;color:var(--dim);margin-bottom:7px}
#log .e{padding:5px 7px 5px 9px;border-left:2px solid var(--faint);margin-bottom:4px;background:rgba(0,0,0,.25);transition:background .6s}
#log .e.new{background:rgba(255,45,85,.22)}
#log .e b{font-weight:500;color:var(--ink)} #log .e span{color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#log .e:nth-child(n+4){display:none}
@media (max-height:720px){#log .e:nth-child(n+3){display:none}}
#log .e.loss{border-color:var(--hit)} #log .e.repair{border-color:var(--ok)} #log .e.strike{border-color:var(--k330)} #log .e.line{border-color:var(--k750)} #log .e.ctx{border-color:var(--water)}

/* ───────────── map-area overlays ───────────── */
#loss{left:calc((var(--pw) + 100vw - var(--rw)) / 2);top:var(--gut);transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .25s;padding:10px 18px 12px;width:max-content;max-width:calc(100vw - var(--pw) - var(--rw) - var(--gut) * 4);z-index:5;
  border-color:rgba(255,45,85,.5);background:rgba(40,6,14,.75)}
#loss.on{opacity:1}
body:not(.rec) #loss{display:none}
#loss .k{font:500 10px var(--mono);letter-spacing:.24em;color:var(--hit)}
#loss .v{font:600 clamp(18px,2vw,26px) var(--sans);letter-spacing:.06em;margin-top:4px}
#loss .s{font:11.5px/1.45 var(--body);color:var(--ink2);margin:4px auto 0;max-width:480px}
#timeline{left:50%;transform:translateX(-50%);width:min(960px,calc(100vw - var(--gut) * 2));bottom:var(--gut);height:148px;opacity:0;padding:8px 14px;z-index:3}
#timeline svg{width:100%;display:block;font-family:var(--mono)}
#timeline .tnote{font:8px/1.4 var(--mono);color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#readout{display:none;right:var(--gut);bottom:30px;text-align:right;font:10px/1.6 var(--mono);color:var(--dim);text-shadow:0 1px 6px #000}
#attrib{position:absolute;left:var(--gut);bottom:5px;max-width:min(560px,calc(100vw - var(--gut)*2));font:8px/1.4 var(--mono);letter-spacing:.01em;color:var(--faint);opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #000;z-index:5;transition:opacity .4s}
#attrib:hover{opacity:1;white-space:normal}
#attrib b{font-weight:500;color:var(--ink2)}
#attrib a{color:inherit}
body.intro #attrib{opacity:0}

/* ───────────── map callouts ───────────── */
.co{width:0;height:0;position:relative;pointer-events:none}
.co .dot{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);box-shadow:0 0 10px rgba(255,255,255,.5);transform:scale(0);transition:transform .5s cubic-bezier(.2,.9,.3,1.3)}
.co .dot::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--ink)}
.co .stem{position:absolute;left:-.5px;bottom:0;width:1px;background:linear-gradient(to top,var(--ink),rgba(255,255,255,.35));height:0;transition:height .7s cubic-bezier(.3,.8,.3,1) .15s}
.co .lab{position:absolute;white-space:nowrap;opacity:0;transform:translateY(6px);transition:opacity .5s .55s,transform .5s .55s;
  background:rgba(10,13,15,.78);border:1px solid var(--edge);padding:6px 10px 7px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.co .lab .i{font:500 10px var(--mono);color:var(--k750);margin-right:7px}
.co .lab b{font:600 14px var(--sans);letter-spacing:.03em}
.co .lab small{display:block;font:11px var(--body);color:var(--ink2);margin-top:2px}
.co.c .lab{transform:translate(-50%,6px)} .co.r .lab{left:0} .co.l .lab{right:0}
.co.on .dot{transform:scale(1)} .co.on .lab{opacity:1;transform:translateY(0)} .co.c.on .lab{transform:translate(-50%,0)}
.co.ring .dot{border-style:dashed}
.co.on.dim .lab{opacity:.18;transition:opacity .35s,transform .5s .55s}
.co.on.dim .stem{opacity:.35}

/* ───────────── record mode (R / ?rec=1): clean frame with full-screen captions ───────────── */
#card,#cap,#title{display:none}
body.rec #panel,body.rec #legend{opacity:0;pointer-events:none}
body.rec #card,body.rec #cap,body.rec #readout{display:block}
body.rec #title{display:flex}
body.rec #loss{left:50%;max-width:none}
body.rec #attrib{display:none}
#cap{left:50%;bottom:60px;transform:translateX(-50%);width:min(980px,76vw);text-align:center;font:400 25px/1.38 var(--sans);text-shadow:0 1px 14px #000,0 0 3px #000;opacity:0}
#cap.on{opacity:1}
body.tl #cap{bottom:190px}
#card{left:44px;top:50%;transform:translateY(-50%);opacity:0}
#card.on{opacity:1}
#card .n{font:500 15px var(--mono);letter-spacing:.3em;color:var(--k750)}
#card .t{font:300 64px/1 var(--sans);letter-spacing:.02em;margin-top:10px;max-width:60vw}
#title{inset:0;flex-direction:column;align-items:center;justify-content:center;opacity:0;text-align:center}
#title.on{opacity:1}
#title .rule{width:min(560px,50vw);height:1px;background:linear-gradient(90deg,transparent,var(--k750),transparent);margin:26px 0}
#title p{margin:0;font:400 15px var(--mono);letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
#title p.cr{margin-top:14px;font-size:11px;line-height:1.7;color:var(--faint);max-width:70vw;letter-spacing:.14em}

#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:12px var(--mono);letter-spacing:.3em;color:var(--dim);background:var(--bg);z-index:9;transition:opacity 1s}

/* ───────────── narrower desktop windows ───────────── */
@media (max-width:1200px) and (min-width:901px){:root{--pw:300px;--rw:220px}}
@media (max-height:640px),(max-width:600px){.co .lab small{display:none}}

/* ───────────── portrait phones / tablets: panel docks at the bottom ───────────── */
@media (max-width:900px) and (min-height:521px){
  :root{--gut:10px}
  #panel{top:auto;bottom:var(--gut);right:var(--gut);width:auto;max-height:52%}
  #pdata #log{display:none!important}
  body.intro #panel{transform:translateY(6px)}
  #rightcol{width:auto;left:var(--gut);flex-direction:row;justify-content:flex-end}
  #legend,#attrib,#readout{display:none!important}
  #counter .v,#ucdpCount .v{font-size:34px}
  #counter .k,#ucdpCount .k{font-size:8.5px;max-width:200px}
  #loss{left:50%;width:calc(100vw - 20px);max-width:none}
}
/* landscape phones: slim side panel only */
@media (max-width:900px) and (max-height:520px){
  :root{--gut:10px;--pw:min(300px,40vw)}
  #rightcol,#legend,#attrib,#readout,#pdata #log{display:none!important}
  .slide h2{font-size:19px}
  .lede{font-size:13.5px}
  #loss{max-width:calc(100vw - var(--pw) - var(--gut) * 3);left:calc((var(--pw) + 100vw) / 2)}
}
@media (prefers-reduced-motion:reduce){.slide{animation:none}}
</style>
</head>
<body class="intro">
<div id="map"></div>
<div id="vignette"></div>
<div id="dimmer"></div>

<div id="loss" class="hud glass"><div class="k">COMPLETE LOSS OF OFF-SITE POWER</div><div class="v"></div><div class="s"></div></div>
<div id="timeline" class="hud glass"><svg viewBox="0 0 1000 120"></svg><div class="tnote"></div></div>
<div id="readout" class="hud"></div>
<div id="rightcol">
  <div id="legend" class="glass"></div>
  <div id="counter" class="glass card" style="opacity:0;display:none"><div class="v">0</div><div><div class="k"></div><div class="k note"></div></div></div>
  <div id="ucdpCount" class="glass card" style="opacity:0;display:none"><div class="v">0</div><div class="k">FATAL EVENTS NEAR THE PLANT · UCDP GED</div></div>
  <div id="log" class="glass" style="opacity:0;display:none"><div class="h">OFF-SITE POWER</div><div class="list"></div></div>
  <div id="lclegend" class="glass" style="opacity:0;display:none"><div class="t"></div><div class="bar"></div><div class="ab"><span class="a"></span><span class="b"></span></div><div class="s">Sentinel-2 · Google Earth Engine</div></div>
  <div id="chart" class="glass" style="opacity:0;display:none"><svg viewBox="0 0 420 150"></svg></div>
</div>

<!-- record-mode overlays (R / ?rec=1) -->
<div id="card" class="hud"><div class="n"></div><div class="t"></div></div>
<div id="title" class="hud"><h1 class="ttl"></h1><div class="rule"></div><p class="st"></p><p class="cr"></p></div>
<div id="cap" class="hud"></div>

<div id="intro"><h1 class="ttl"></h1></div>

<aside id="panel" class="glass" aria-label="Story">
  <div class="pbody" id="pbody" aria-live="polite"></div>
  <div id="pdata"></div>
  <nav id="menu" aria-label="Slides"></nav>
  <div class="pnav">
    <div id="scrub" title="Scrub this slide"><div class="fill"></div></div>
    <button id="bBack" aria-label="Previous slide"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg>Back</button>
    <button id="bPlay" aria-label="Pause" title="Play / pause (Space)"></button>
    <button id="bSnd" aria-label="Mute narration"></button>
    <button id="bMenu" aria-label="All slides" aria-expanded="false"><span id="pg">1 / 9</span></button>
    <button id="bNext" aria-label="Next slide">Next<svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
  </div>
</aside>

<div id="attrib"></div>
<div id="loading">LOADING</div>
<audio id="snd" src="audio/soundtrack.m4a" preload="none"></audio>

<script src="data.js"></script>
<script src="extra.js"></script>
<script src="story.js"></script>
<script src="flatten.js"></script>
<script src="plant3d.js"></script>
<script src="film.js"></script>
</body>
</html>
